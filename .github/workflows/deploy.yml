# Deploys Village Partners to New Village Academy's Easel tenants (Playlab's lab
# school hosting on AWS) with the Ext App Deploy workflow in
# duplocloud-infrastructure. It builds this repo's Dockerfile, and this repo's
# GitHub variables and secrets become the app's env vars (the repo's for both,
# the exdnva/extnva environment's for just that one). The app is `partners`
# under the `nva` school in that repo's config/exttenant/schools.tfvars.
#   dev:  every push to main
#   prod: Actions → Deploy → Run workflow, from main
# Pushes only test until the app is set up on Easel: applying its schools.tfvars
# entry sets this repo's EXTAPP_SCHOOL variable, and from then on pushes deploy.
# See docs/easel.md.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        default: dev
        options: [dev, prod]
      cmd:
        description: plan to preview, apply to deploy
        type: choice
        default: plan
        options: [plan, apply]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci && npm run typecheck && npm test

  deploy:
    needs: test
    if: vars.EXTAPP_SCHOOL != ''
    uses: playlab-education/duplocloud-infrastructure/.github/workflows/extapp-workflow.yml@main
    secrets: inherit
    with:
      environment: ${{ inputs.environment || 'dev' }}
      cmd: ${{ inputs.cmd || 'apply' }}
      # Runs in the new image, as the database owner, before it deploys; the deploy stops if it fails.
      before_update: npm run db:migrate
